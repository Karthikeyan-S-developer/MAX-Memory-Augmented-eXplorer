version: "3.9"
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: MAX
      DEBUG: "true"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      POSTGRES_DSN: postgresql://max:dev@postgres:5432/max
    depends_on:
      - postgres
      - qdrant

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: max
      POSTGRES_USER: max
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
